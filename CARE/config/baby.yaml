# config/baby.yaml
# ------------------
# Amazon-Baby 完整数据集配置

dataset:
  name:          baby
  raw_inter:     data/raw/Baby_Products.jsonl
  raw_meta:      data/raw/meta_Baby_Products.jsonl
  data_dir:      data/baby
  cache_dir:     cache/baby
  image_dir:     data/baby/images
  k_core:        5
  is_beauty_sub: false

# 数据集规模（preprocess 后自动写入 stats.json，此处为参考值）
stats:
  n_users_approx:  19445
  n_items_approx:   7050
  n_inter_approx: 160792

# 特征维度
features:
  clip_dim:       768    # CLIP ViT-L/14 特征维度
  collab_dim:      64    # LightGCN 协同嵌入维度

# 训练超参数
training:
  batch_size:     512
  epochs:         100
  lr_main:        1e-3
  lr_lora:        5e-4
  weight_decay:   1e-4
  early_stop:     10      # 验证集不提升则停止
  seeds:          [42, 123, 456]

# 模型结构
model:
  d:              64      # 推荐嵌入维度（消融扫描：16/32/64/128/256）
  n_layers:        3      # LightGCN 层数
  lora_rank:       8      # LoRA 秩（消融扫描：4/8/16/32）
  tau:            0.1     # 对比学习温度（消融扫描：0.01/0.05/0.1/0.2/0.5）
  n_coarse:       20      # 粗排候选数（消融扫描：5/10/20/30）

# 评估
evaluation:
  k_list:         [5, 10, 20]
  main_metric:    ndcg@10
  n_neg_samples:  99      # 每个正样本对应的负样本数
